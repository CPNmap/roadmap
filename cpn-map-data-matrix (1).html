<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPN-Map — Biobank Data Matrix</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/tabler-icons.min.css">
<style>
/* ============================================================
   CPN-Map Biobank Data Matrix
   ----------------------------------------------------------
   HOW TO EDIT:
   Scroll down to the <script> tag and find the DATA object.
   Each cohort and each data layer is a plain JSON entry.
   Change text, add cohorts, toggle availability — save & reload.
   ============================================================ */

:root {
  --bg: #fafaf8;
  --bg2: #f1efe8;
  --bg-card: #ffffff;
  --text: #1a1a18;
  --text2: #5f5e5a;
  --text3: #888780;
  --border: rgba(0,0,0,.1);
  --border2: rgba(0,0,0,.06);
  --teal-50: #E1F5EE; --teal-600: #0F6E56; --teal-800: #085041;
  --purple-50: #EEEDFE; --purple-600: #534AB7; --purple-800: #3C3489;
  --coral-50: #FAECE7; --coral-600: #993C1D; --coral-800: #712B13;
  --amber-50: #FAEEDA; --amber-600: #854F0B; --amber-800: #633806;
  --green-50: #EAF3DE; --green-600: #3B6D11; --green-800: #27500A;
  --blue-50: #E6F1FB; --blue-600: #185FA5; --blue-800: #0C447C;
  --red-50: #FCEBEB; --red-600: #A32D2D; --red-800: #791F1F;
  --gray-50: #F1EFE8; --gray-600: #5F5E5A; --gray-800: #444441;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --bg2: #2c2c2a; --bg-card: #232321;
    --text: #e8e6de; --text2: #b4b2a9; --text3: #888780;
    --border: rgba(255,255,255,.1); --border2: rgba(255,255,255,.04);
    --teal-50: #085041; --teal-600: #5DCAA5; --teal-800: #9FE1CB;
    --purple-50: #3C3489; --purple-600: #AFA9EC; --purple-800: #CECBF6;
    --coral-50: #712B13; --coral-600: #F0997B; --coral-800: #F5C4B3;
    --amber-50: #412402; --amber-600: #EF9F27; --amber-800: #FAC775;
    --green-50: #27500A; --green-600: #97C459; --green-800: #C0DD97;
    --blue-50: #0C447C; --blue-600: #85B7EB; --blue-800: #B5D4F4;
    --red-50: #791F1F; --red-600: #F09595; --red-800: #F7C1C1;
    --gray-50: #444441; --gray-600: #B4B2A9; --gray-800: #D3D1C7;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.subtitle { font-size: 14px; color: var(--text2); margin-bottom: 6px; }
.last-updated { font-size: 11px; color: var(--text3); margin-bottom: 24px; }

/* Nav tabs */
.nav { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.nav-btn {
  padding: 7px 16px; font-size: 13px; font-family: var(--font);
  border: 0.5px solid var(--border); border-radius: 8px;
  background: transparent; color: var(--text2); cursor: pointer;
  transition: all .15s;
}
.nav-btn:hover { background: var(--bg2); }
.nav-btn.active { background: var(--purple-50); color: var(--purple-800); border-color: var(--purple-600); }

/* Panel */
.panel { display: none; }
.panel.active { display: block; }

/* Flow layout */
.flow-grid {
  display: grid;
  grid-template-columns: 240px 28px minmax(0,1fr) 28px 240px;
  gap: 0; align-items: start; margin-bottom: 16px;
}
.flow-arrow {
  display: flex; align-items: center; justify-content: center;
  padding-top: 36px; color: var(--text3); font-size: 18px;
}
.col-title {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 10px; padding-left: 2px;
}

/* Source cards */
.src {
  background: var(--bg-card); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
  font-size: 11px; line-height: 1.5;
}
.src-name { font-weight: 600; font-size: 12px; color: var(--text); margin-bottom: 2px; }
.src-detail { color: var(--text2); }
.src-tag {
  display: inline-block; font-size: 9px; font-weight: 600;
  padding: 1px 6px; border-radius: 4px; margin-top: 4px;
}
.tag-shotgun { background: var(--purple-50); color: var(--purple-800); }
.tag-16s { background: var(--amber-50); color: var(--amber-800); }
.tag-ffq { background: var(--teal-50); color: var(--teal-800); }
.tag-app { background: var(--coral-50); color: var(--coral-800); }
.tag-recall { background: var(--blue-50); color: var(--blue-800); }
.tag-nmr { background: var(--green-50); color: var(--green-800); }
.tag-lcms { background: var(--purple-50); color: var(--purple-800); }
.tag-metabolon { background: var(--coral-50); color: var(--coral-800); }
.tag-biocrates { background: var(--amber-50); color: var(--amber-800); }
.tag-none { background: var(--gray-50); color: var(--gray-800); }
.tag-planned { background: var(--blue-50); color: var(--blue-800); }

/* Process boxes */
.proc {
  border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
}
.proc-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.proc-desc { font-size: 11px; line-height: 1.55; opacity: .85; }

/* Output cards */
.out {
  border-radius: 8px; padding: 9px 12px; margin-bottom: 6px;
  font-size: 11px; line-height: 1.5;
}
.out-name { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
.out-detail { opacity: .8; }
.out-yes { background: var(--green-50); color: var(--green-800); }
.out-partial { background: var(--amber-50); color: var(--amber-800); }
.out-no { background: var(--gray-50); color: var(--gray-800); }

/* Depth bars */
.depth-section { margin-top: 18px; }
.depth-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
.depth-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
.depth-label { min-width: 110px; color: var(--text2); }
.depth-bar { flex: 1; height: 7px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
.depth-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
.depth-val { min-width: 120px; text-align: right; color: var(--text3); font-size: 10px; }

/* Notes */
.note {
  font-size: 12px; color: var(--text2); line-height: 1.6;
  margin-top: 14px; padding: 12px 14px;
  background: var(--bg2); border-radius: 8px;
}
.note strong { font-weight: 600; color: var(--text); }

/* Cohort overview cards */
.cohort-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 24px; }
.cohort-card {
  background: var(--bg-card); border: 0.5px solid var(--border);
  border-radius: 10px; padding: 12px; text-align: center;
}
.cohort-card .cc-name { font-size: 13px; font-weight: 600; }
.cohort-card .cc-n { font-size: 20px; font-weight: 600; color: var(--purple-600); margin: 4px 0; }
.cohort-card .cc-country { font-size: 11px; color: var(--text3); }
.cohort-card .cc-type { font-size: 10px; color: var(--text2); margin-top: 2px; }

/* Responsive */
@media (max-width: 800px) {
  .flow-grid { grid-template-columns: 1fr; }
  .flow-arrow { padding: 8px 0; transform: rotate(90deg); }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

/* ================================================================
   RENDERING — You shouldn't need to edit below this line
   ================================================================ */

function renderTagHTML(tag) {
  const cls = 'tag-' + tag;
  const labels = {
    shotgun: 'SHOTGUN', '16s': '16S', ffq: 'FFQ', app: 'APP LOGS',
    recall: '24H RECALL', nmr: 'NMR', lcms: 'LC-MS', metabolon: 'METABOLON',
    biocrates: 'BIOCRATES', none: 'NONE', planned: 'PLANNED'
  };
  return `<span class="src-tag ${cls}">${labels[tag] || tag}</span>`;
}

function renderPanel(key, layer) {
  const procColors = { purple: 'purple', teal: 'teal', coral: 'coral', amber: 'amber' };

  let srcHTML = layer.sources.map(s => `
    <div class="src">
      <div class="src-name">${s.cohort}</div>
      <div class="src-detail">${s.detail}</div>
      <div style="margin-top:3px;font-size:10px;color:var(--text3)"><i class="ti ti-lock" style="font-size:12px;vertical-align:-1px"></i> ${s.access}</div>
      <div>${s.tags.map(renderTagHTML).join(' ')}</div>
    </div>`).join('');

  let procHTML = layer.processing.map(p => `
    <div class="proc" style="background:var(--${p.color}-50);color:var(--${p.color}-800)">
      <div class="proc-title">${p.title}</div>
      <div class="proc-desc">${p.desc}</div>
    </div>`).join('');

  let outHTML = layer.outputs.map(o => `
    <div class="out out-${o.status}">
      <div class="out-name">${o.name}</div>
      <div class="out-detail">${o.detail}</div>
    </div>`).join('');

  let depthHTML = layer.depths ? layer.depths.map(d => `
    <div class="depth-row">
      <span class="depth-label">${d.cohort}</span>
      <div class="depth-bar"><div class="depth-fill" style="width:${d.pct}%;background:${d.color}"></div></div>
      <span class="depth-val">${d.label}</span>
    </div>`).join('') : '';

  return `
    <div class="panel" id="panel-${key}">
      <div class="flow-grid">
        <div>
          <div class="col-title">Raw inputs per cohort</div>
          ${srcHTML}
        </div>
        <div class="flow-arrow"><i class="ti ti-arrow-right"></i></div>
        <div>
          <div class="col-title">Processing &amp; harmonization</div>
          ${procHTML}
        </div>
        <div class="flow-arrow"><i class="ti ti-arrow-right"></i></div>
        <div>
          <div class="col-title">Derivable common outputs</div>
          ${outHTML}
        </div>
      </div>
      ${depthHTML ? `<div class="depth-section"><div class="depth-title">Processing depth reachable per cohort</div>${depthHTML}</div>` : ''}
      <div class="note">${layer.note}</div>
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  const layerKeys = Object.keys(DATA.layers);

  let cohortCards = DATA.cohorts.map(c => `
    <div class="cohort-card">
      <div class="cc-name">${c.name}</div>
      <div class="cc-n">${c.n}</div>
      <div class="cc-country">${c.country}</div>
      <div class="cc-type">${c.type}</div>
    </div>`).join('');

  let navBtns = layerKeys.map((k, i) => `
    <button class="nav-btn ${i === 0 ? 'active' : ''}" data-panel="${k}">
      <i class="${DATA.layers[k].icon}" style="font-size:14px;vertical-align:-1px;margin-right:4px"></i>
      ${DATA.layers[k].label}
    </button>`).join('');

  let panels = layerKeys.map(k => renderPanel(k, DATA.layers[k])).join('');

  app.innerHTML = `
    <h1>CPN-Map — Biobank data matrix</h1>
    <div class="subtitle">Data accessibility, formats, and harmonization pathways across all cohorts</div>
    <div class="last-updated">Last updated: ${DATA.lastUpdated} · Edit the DATA object in this file to update</div>
    <div class="cohort-grid">${cohortCards}</div>
    <div class="nav">${navBtns}</div>
    ${panels}
  `;

  // Activate first panel
  document.querySelector('.panel').classList.add('active');

  // Tab switching
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });
}

render();
</script>
</body>
</html>
